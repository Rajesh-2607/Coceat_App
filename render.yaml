# Render Blueprint: API only (frontend is on Cloudflare Pages, DB on Neon).
# Secrets are `sync: false`: Render prompts for them once; they are never stored in git.
services:
  - type: web
    name: cocreat-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore            # same AWS region as Neon (ap-southeast-1): API<->DB latency dominates
    plan: starter                # scale up the plan (vertical) first, then numInstances (horizontal)
    numInstances: 1
    healthCheckPath: /healthz    # liveness only; /readyz would flap while Neon wakes from scale-to-zero
    preDeployCommand: alembic upgrade head   # runs once per deploy, before traffic shifts; failure aborts deploy
    autoDeployTrigger: checksPass            # deploy main only after GitHub Actions CI passes
    envVars:
      - key: APP_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: "2"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: OTP_DEV_MODE
        value: "false"
      - key: DB_APP_ROLE
        value: cocreat_app
      - key: CORS_ORIGINS
        value: '["https://app.cocreat.in"]'
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: SMS_OTP_TEMPLATE_ID
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: SENTRY_DSN
        sync: false
