# Render Blueprint: free single-service deploy. One free web service runs the API and serves the built web app
# (root Dockerfile), so the app and API share one address and the login cookie works without a custom domain.
# Database: Neon free tier. Secrets are `sync: false`: Render prompts for them once; they are never stored in git.
services:
  - type: web
    name: cocreat
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: ohio                 # same region as the Neon database (AWS US East 2)
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass  # deploy main only after GitHub Actions CI passes
    envVars:
      - key: APP_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: OTP_DEV_MODE
        value: "false"
      - key: DB_APP_ROLE
        value: cocreat_app
      - key: CORS_ORIGINS
        sync: false               # https://<your-service>.onrender.com (set after the first deploy)
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: SMS_OTP_TEMPLATE_ID
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
