[project]
name = "cocreat-api"
version = "0.1.0"
description = "Cocreat Business OS API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "sentry-sdk[fastapi]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pgserver>=0.1.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "N", "SIM", "DTZ"]
ignore = ["S101", "B008", "N818"]  # N818: HTTP-style error names (NotFound) read better

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
"alembic/**" = ["N999", "E501", "S608"]  # role name is validated in Settings

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]
